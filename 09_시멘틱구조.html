<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시멘틱 구조</title>
    <style>
        div{width: 500px; background-color: gold;}
        span{font-weight: bold; color: red;}
    </style>
</head>

<body>
    <!-- 
    <span>: HTML에서 특별한 의미나 레이아웃 기능 없이 텍스트의 일부분을 감싸는 인라인 컨테이너 태그
    <div>(박스로 만듦): HTML에서 의미를 가지지 않는 블록 단위의 컨테이너 태그로, 여러 요로를 
                        하나의 그룹으로 묶어 페이지의 구조를 나누거나 레이아웃을 구성할 때 사용
     -->
    
     <div>
        이것은 div 태그임
        하나의 블록 영역 차지
     </div>
     <div>
        이것은 div 태그임
        하나의 블록 영역 차지
        이 문장 안에서 <span>이 부분만 span 태그</span>로 감쌌습니다.
     </div>
</body>

</html>
