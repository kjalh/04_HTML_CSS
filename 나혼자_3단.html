<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나혼자 3단</title>

    <style>
        .container{
            padding: 10px;
            border: 2px solid #000;
            margin: 10px;
        }

        header, footer{
            padding: 10px;
            margin: 10px;
            border: 2px solid #000;
        }

        main{
            padding: 10px;
            margin: 10px;
            border: 2px solid #000;
        }

        .left{
            float: left;
            padding: 10px;
            width: 17%;
            height: 50px;
            border: 2px solid #000;
            margin: 10px;
        }
        .center{
            float: left;
            padding: 10px;
            width: 50%;
            height: 50px;
            border: 2px solid #000;
            margin: 10px;
        }
        .right{
            float: left;
            padding: 10px;
            width: 17%;
            height: 50px;
            border: 2px solid #000;
            margin: 10px;
        }
        .clear{
            clear: both;
        }

    </style>


</head>

<body>
    <div class="container">
        큰거 만듦
        <header>
            자라나라 머리머리
        </header>

        <main>
            <section class="left">
                왼섹
            </section>

            <aside class="center">
                중섹
            </aside>

            <aside class="right">
                오섹
            </aside>

            <div class="clear"></div>

        </main>

        <footer>
            끝이다 이자식아
        </footer>
    </div>
</body>

</html>
