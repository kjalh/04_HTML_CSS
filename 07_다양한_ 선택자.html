<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다양한 선택자</title>
    <style>
        /*1. 태그 선택자*/
        h1{color: deepskyblue; text-align: center;}
        
        /*2. 클래스 선택자*/
        .intro { font-weight: bold; color: deeppink;}

        /*3.  아이디 선택자*/
        #favorite-list{
            background-color: ivory;
            padding: 10px   /* boader와 content 사이를 padding*/

        }
        
        /*4. 그룹 선택자*/
        p, li{font-size: 20px;}/*PC 기본 글꼴 사이즈는 16px*/
        
        /*5. 클래스 선택자*/
        .bluecolor{color: blue;}
        .highlight{font-style: italic;}

        /*6. 의사 클래스 선택자*/
        a:hover{color: yellowgreen; text-decoration: none;}/*링크 태그는 기본값으로 밑줄이 깔려 있음*/

        /*7. 속성 선택자*/
        h1[title="제목"] {background-color: ivory;}

        /*8. 자식 선택자*/
        ul#favorite-list > li{list-style-type: square ;}/*리스트 앞 부분의 점이 네모로 바뀜*/

        /*9. 자손 선택자(자식 포함)*/
        ul#favorite-list p{
            color: violet;
            font-weight: bold;
        }

        /*10. 형제 선택자*/
        p.intro + p{background-color: aqua;}

        
        






    </style>
</head>
<body>
    <h1 title="제목">선택자</h1> <!--선택자라는 제목 위에 마우스 올리면 제목이라는 글자가 보임-->

    <p class="intro">이 문단은 첫번째 문단입니다.</p>
    <p id="favorite-list"> 이 문단은 두번째 문단입니다.</p> <!--id가 identity의 줄임말. 그래서 id는 서로 달라야 함-->

    <ul id="favorite-list">
      <li class="bluecolor">김사과</li>
      <li class="bluecolor highlight">반하나</li>
      <li class="bluecolor">오렌지</li>
      <p>출석부</p>
    </ul>

    <a href="https://www.naver.com">외부 링크</a>
    <a href="#top">내부 링크</a>
    <a href="./05_하이퍼링크.html" class="intro">하이퍼링크</a>


</body>
</html>
