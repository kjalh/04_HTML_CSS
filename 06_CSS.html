<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        body {background-color: deepskyblue;}
        h1 { color: white; text-align: center;}
    </style>
    <link rel="stylesheet" href="./css/test.css">  <!--위에 충돌 났을 시 더 아래에 있는거 덮음  <- 이게 외부 스타일--> 
</head>
<body>
    <!-- 
        CSS(Cascading Style Sheets)는 HTML과 함께 사용되며 웹 페이지의 스타일과 레이아웃을 정의하는 스타일 시트 언어

        선택자 {속성, 값;}

        선택자: 어떤 HTML 요소에 스타일을 적용할지 지정
            h1 { color: red;}

        스타일 적용 방법
        1. 인라인 스타일: HTML 태그 안에 직접 style 속성으로 CSS를 작성하는 방식
        2. 내부 스타일: <style> 태그를 사용하여 CSS를 작성하는 방식
        3. 외부 스타일: CSS 코드를 별도의  .css 파일에 작성하고, HTML 문서에서 Link 태그로 연걸하는 방식 <-- 이걸 많이 사용함
     -->
    
    <h1>CSS란?</h1>
    <p style="color: gold;">안녕하세요. CSS입니다.</p>
    <!-- 겹치는 건 인라인이 우선 -->


</body>
</html>
