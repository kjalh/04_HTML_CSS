<html lang="en">
<head>

    <style>
        
        @font-face {

        /*body{font-family: 'Aggravo';}*/

        .container{

        }

        }

            transform: scale(1.2);
            background-color: aqua;
            
            transition-duration: 0.5s;
            /*transition-delay: 0.2s;*/
        }


        .column{
            display: flex;

        }


        
        p2{

        }
